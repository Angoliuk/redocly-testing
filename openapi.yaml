openapi: 3.1.0
servers:
  - url: https://{host}
    variables:
      host:
        default: realm.redocly.com
        description: Server host.
    description: Production main server.
info:
  title: Realm
  version: 1.0.0
  description: API for Realm service.
  termsOfService: https://redocly.com/subscription-agreement
  license:
    name: Redocly
    url: https://redocly.com/subscription-agreement

security:
  - ApiKey: []

tags:
  - name: health
    description: Health check operations.
  - name: Cors proxy
    description: Internal cors proxy operations.
  - name: Entities
    description: Catalog entities operations.
  - name: BFF Entities
    description: Catalog entities for frontend operations.
  - name: Entity relations
    description: Catalog entities relations operations.

paths:
  /_health:
    get:
      tags:
        - health
      summary: Health check
      description: Returns the health status of the service.
      responses:
        '200':
          description: OK
  /_api/cors:
    get:
      tags:
        - Cors proxy
      summary: CORS proxy
      description: Internal cors proxy operation.
      responses:
        '200':
          description: OK
  /_api/cors/{targetUrl}:
    get:
      tags:
        - Cors proxy
      summary: CORS proxy with target URL
      description: Internal cors proxy operation with target URL.
      parameters:
        - name: targetUrl
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /catalog-entities:
    get:
      tags:
        - Entities
      summary: List catalog entities
      description: Returns a list of catalog entities.
      responses:
        '200':
          description: OK
  /catalog-entities/{catalogEntityId}:
    get:
      tags:
        - Entities
      summary: Get catalog entity
      description: Returns a single catalog entity by ID.
      parameters:
        - name: catalogEntityId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /bff/catalog-entities:
    get:
      tags:
        - BFF Entities
      summary: List BFF catalog entities
      description: Returns a list of catalog entities for the frontend.
      responses:
        '200':
          description: OK
  /bff/catalog-entities/{catalogEntityKey}:
    get:
      tags:
        - BFF Entities
      summary: Get BFF catalog entity
      description: Returns a single catalog entity for the frontend by key.
      parameters:
        - name: catalogEntityKey
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /bff/catalog-related-entities/{catalogEntityKey}:
    get:
      tags:
        - BFF Entities
      summary: List related catalog entities
      description: Returns related catalog entities for a given entity key.
      parameters:
        - name: catalogEntityKey
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /bff/catalog-revisions/{catalogEntityKey}:
    get:
      tags:
        - BFF Entities
      summary: List catalog revisions
      description: Returns revisions for a given catalog entity key.
      parameters:
        - name: catalogEntityKey
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /catalog-entities-relations:
    get:
      tags:
        - Entity relations
      summary: List catalog entities relations
      description: Returns a list of catalog entities relations.
      responses:
        '200':
          description: OK
  /catalog-entities-relations/{catalogEntityRelationId}:
    get:
      tags:
        - Entity relations
      summary: Get catalog entity relation
      description: Returns a single catalog entity relation by ID.
      parameters:
        - name: catalogEntityRelationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK

components:
  securitySchemes:
    ApiKey:
      type: apiKey
      name: X-API-Key
      in: header
